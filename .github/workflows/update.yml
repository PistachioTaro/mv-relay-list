name: Update Mullvad IPv6 relay list

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build list
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 60 -o relays.json https://api.mullvad.net/app/v1/relays
          jq -r '.wireguard.relays[] | select(.ipv6_addr_in) | .ipv6_addr_in + "/128"' relays.json | sort -u > new.txt
          COUNT=$(wc -l < new.txt)
          echo "Found $COUNT addresses"
          if [ "$COUNT" -lt 300 ]; then echo "Too few addresses, aborting"; exit 1; fi
          if grep -qvE '^[0-9a-f:]+/128$' new.txt; then echo "Malformed line, aborting"; exit 1; fi
          mv new.txt mullvad-ipv6.txt
          rm relays.json

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain mullvad-ipv6.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mullvad-ipv6.txt
            git commit -m "Update Mullvad IPv6 relay list"
            git push
          else
            echo "No changes"
          fi
